[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "humanml3d-search"
version = "0.1.0"
description = "Reproducible caption-based activity retrieval in HumanML3D"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
semantic = ["sentence-transformers==5.1.2", "transformers==4.57.1", "huggingface-hub==0.36.0"]
rendering = ["matplotlib==3.9.4"]

[project.scripts]
humanml3d-search = "humanml3d_search.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
